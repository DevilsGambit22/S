<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12090c">
  <meta name="description" content="The ANHS Protocol academy dashboard and radio.">
  <title>The ANHS Protocol</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="grid"></div>
    <div class="scanline"></div>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#home" aria-label="ANHS home">
      <span class="brand-mark">A</span>
      <span><strong>ANHS OS</strong><small>Advanced Nurturing High School</small></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">☰</button>
    <nav id="mainNav" class="main-nav" aria-label="Primary navigation">
      <a href="#home">Home</a>
      <a href="#registry">Registry</a>
      <a href="#command">Command</a>
      <a href="#directives">Directives</a>
      <a href="#partners">Partners</a>
      <a href="#exchange">TBX</a>
      <a href="#console">Console</a>
      <a href="#radio">Radio</a>
      <a href="#enroll">Enroll</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <span>THE ANHS PROTOCOL</span>
    <span>Build 4.1 • 2026</span>
  </footer>

  <aside class="mini-player" id="miniPlayer" aria-label="ANHS Radio">
    <img id="miniCover" src="assets/images/default-cover.svg" alt="Current track artwork">
    <div class="mini-meta">
      <strong id="miniTitle">ANHS Radio</strong>
      <small id="miniArtist">Select a track</small>
    </div>
    <button id="prevBtn" aria-label="Previous track">⏮</button>
    <button id="playBtn" class="play-button" aria-label="Play">▶</button>
    <button id="nextBtn" aria-label="Next track">⏭</button>
    <input id="volume" type="range" min="0" max="1" value="0.75" step="0.01" aria-label="Volume">
    <a href="#radio" class="open-radio">RADIO</a>
  </aside>

  <audio id="audio" preload="metadata"></audio>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/radio.js"></script>
</body>
</html>
